# VXAntiXRay+ Configuración
# Plugin ligero anti-xray sin ProtocolLib

# Distancia mínima para detectar minerales (en bloques)
detection-distance: 4

# Mensaje enviado al jugador cuando detecta un mineral
# Variables: %block%, %location%
detection-message: "§a¡Mineral detectado!"

# Bloques que serán ocultados hasta la detección
hidden-blocks:
  - DIAMOND_ORE
  - DEEPSLATE_DIAMOND_ORE
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - ANCIENT_DEBRIS
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - REDSTONE_ORE
  - DEEPSLATE_REDSTONE_ORE
  - LAPIS_ORE
  - DEEPSLATE_LAPIS_ORE
  - COAL_ORE
  - DEEPSLATE_COAL_ORE
  - IRON_ORE
  - DEEPSLATE_IRON_ORE
  - COPPER_ORE
  - DEEPSLATE_COPPER_ORE

# Alertas para el staff
staff-alerts:
  enabled: true
  # Mensaje enviado a jugadores con permiso vxantixray.alerts
  # Variables: %player%, %block%, %location%
  message: "§e[AntiXRay] §f%player% §eha encontrado §f%block% §een §f%location%"

# Sistema de logging
logging:
  enabled: true
  # Los logs se guardan en plugins/VXAntiXRay+/detections.log

# Sistema de bypass
bypass:
  # Notificar a jugadores con bypass cuando se conecten
  notify-player: true
  # Mensaje de notificación
  notification-message: "§e[AntiXRay] §7Tienes bypass activo - puedes ver todos los minerales."

# Configuración avanzada
advanced:
  # Frecuencia de escaneo (en ticks, 20 = 1 segundo)
  scan-interval: 20

  # Radio de escaneo (bloques adicionales para ocultar)
  scan-radius-bonus: 5

  # Materiales usados para ocultar (basado en altura)
  fake-materials:
    deep: DEEPSLATE
    low: STONE
    mid: STONE
    high: STONE

# Permisos:
# vxantixray.admin - Acceso a comandos administrativos
# vxantixray.alerts - Recibir alertas de detecciones
# vxantixray.bypass - Bypass del sistema (ver todos los minerales)