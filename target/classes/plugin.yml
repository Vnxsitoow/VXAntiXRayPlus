name: VXAntiXRayPlus
version: 1.0.0
main: com.vnx.vXAntiXRayPlus.VXAntiXRayPlus
api-version: 1.20
author: Vnxsitoow
description: Sistema anti-xray ligero y configurable para Minecraft

commands:
  vxantixray:
    description: Comando principal de VXAntiXRay+
    usage: /vxantixray <reload|info|stats|log|toggle>
    permission: vxantixray.admin
    aliases: [vxar, antixray]

permissions:
  vxantixray.admin:
    description: Acceso completo a comandos administrativos
    default: op
  vxantixray.alerts:
    description: Recibir alertas de detecciones
    default: op
  vxantixray.bypass:
    description: Bypass del sistema anti-xray
    default: false